name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # -------------------------
    # Backend (Python)
    # -------------------------
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install backend dependencies
      run: |
        pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run backend tests
      run: |
        pytest backend/tests || echo "No backend tests yet"

    # -------------------------
    # Frontend (Node)
    # -------------------------
    - name: Set up Node
      uses: actions/setup-node@v3
      with:
        node-version: "18"

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install

    - name: Build frontend
      run: |
        cd frontend
        npm run build
